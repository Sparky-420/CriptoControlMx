name: Build experimental debug APK

on:
  push:
    branches: [experimental, fase-1-v2, fase-2-core, fase-2.1-tech-debt]
  pull_request:
    branches: [experimental, fase-1-v2, fase-2-core, fase-2.1-tech-debt]
  workflow_dispatch:

jobs:
  build-apk:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/experimental') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/fase-1-v2') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/fase-2-core') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/fase-2.1-tech-debt') ||
      (github.event_name == 'pull_request' && github.base_ref == 'experimental') ||
      (github.event_name == 'pull_request' && github.base_ref == 'fase-1-v2') ||
      (github.event_name == 'pull_request' && github.base_ref == 'fase-2-core') ||
      (github.event_name == 'pull_request' && github.base_ref == 'fase-2.1-tech-debt') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/experimental') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fase-2-core') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fase-2.1-tech-debt')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cripto-control-mx-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

