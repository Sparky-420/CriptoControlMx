name: CriptoControlMx Signed Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - release-candidate-fenix-20261104
      - codex/fenix-fase-4-7-simulation-alert-label
    paths:
      - ".github/workflows/release-android-signed.yml"
      - "pubspec.yaml"
      - "android/**"
      - "lib/**"
      - "test/**"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Generate Android Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.4 --distribution-type all

      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Restore upload keystore and key.properties
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          keytool -list -keystore android/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Release keystore and alias validated; credentials were not printed."

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build signed release APK (versionCode 16)
        run: flutter build apk --release --build-number 16

      - name: Build signed release AAB (versionCode 16)
        run: flutter build appbundle --release --build-number 16

      - name: Verify Play Store signing identity and APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$APKANALYZER"

          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE_OUTPUT"
          ACTUAL_CERT="$(printf '%s\\n' "$SIGNATURE_OUTPUT" | awk -F': ' '/certificate SHA-256 digest:/ {print toupper($2); exit}' | tr -d ':')"
          EXPECTED_PLAY_CERT="EDEE10475CE93EA17AC3A1F37488A78D67D696A6CF30706C703BF6C8BE5A6A82"
          if [ "$ACTUAL_CERT" != "$EXPECTED_PLAY_CERT" ]; then
            echo "::error::APK signing certificate does not match the Google Play-installed Beta 14 certificate."
            echo "::error::Expected SHA-256: $EXPECTED_PLAY_CERT"
            echo "::error::Actual SHA-256: ${ACTUAL_CERT:-missing}"
            exit 1
          fi

          PACKAGE="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          echo "Package: $PACKAGE"
          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          test "$PACKAGE" = "mx.criptocontrolmx.app"
          test "$VERSION_NAME" = "1.0.0-beta.15"
          test "$VERSION_CODE" = "16"
          sha256sum "$APK"

      - name: Verify AAB exists
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CriptoControlMx-release-v16-signed
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
