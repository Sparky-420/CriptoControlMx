name: Flutter V2 Check

on:
  push:
    branches:
      - master
      - ui-premium-sin-tocar-matematica
      - refactor-ui-matematica-segura
  pull_request:
    branches:
      - master
      - ui-premium-sin-tocar-matematica
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Safe refactor guard
        run: dart run tool/refactor_guard.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
